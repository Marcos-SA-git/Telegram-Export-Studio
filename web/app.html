/* ---- copy mode shared by compact / enhance / restore ---- */

// Asks for a folder and creates a fresh "<base>" subfolder in it (numbered
// if taken). Returns { parent, name, handle }, or null if the picker was
// dismissed. Refuses a source export itself or any folder inside it:
// writing into your own tree would make the copy walk into itself.
async function pickNewFolder(sources, base) {
  let parent;
  try {
    parent = await showDirectoryPicker({ id: "tgx-out", mode: "readwrite" });
  } catch (e) {
    dbg(`pickNewFolder: selector cerrado/fallido — ${e.name}: ${e.message}`);
    return null;
  }
  for (const src of sources) {
    if ((await src.resolve(parent)) !== null) {
      snack(t("copy_inside_source"));
      return null;
    }
  }
  let name = base;
  for (let n = 2; ; n++) {
    try { await parent.getDirectoryHandle(name); } catch (_) { break; }
    name = `${base} (${n})`;
  }
  const handle = await parent.getDirectoryHandle(name, { create: true });
  dbg(`pickNewFolder: resultado en «${parent.name}/${name}»`);
  return { parent, name, handle };
}
function pickCopyTarget(src, suffix) {
  return pickNewFolder([src], src.name + suffix);
}

// Copies everything except the messages*.html pages (the job writes those)
// from src into dst. Files Safe Browsing refuses go to `failed` (same shape
// as copyMediaTree's failedSink), to be offered as a rescue ZIP.
async function copyExport(src, dst, failed) {
  const t0 = performance.now();
  const concurrency = await benchmarkConcurrency(dst);
  mediaDone = 0;
  await copyMediaTree(src, dst, new Map(), true, concurrency, failed);
  for await (const [name, h] of src.entries()) {
    checkCancel();
    if (h.kind !== "file" || HTML_RE.test(name)) continue;
    const f = await h.getFile();
    try {
      const fh = await dst.getFileHandle(name, { create: true });
      await f.stream().pipeTo(await fh.createWritable(), { signal: cancelSignal() });
    } catch (e) {
      if (e.name !== "AbortError") throw e; // JobCancelled included: its name differs
      dbg(`copyExport: NO copiado — ${name}: ${e.name}: ${e.message}`);
      try { await dst.removeEntry(name); } catch (_) {}
      failed.push({ handle: h, target: name, size: f.size });
      pushWarnItem("blocked", `${name} (${humanSize(f.size)})`);
    }
  }
  dbg(`copyExport: «${src.name}» → «${dst.name}» en ${((performance.now() - t0) / 1000).toFixed(1)}s, ` +
      `${failed.length} bloqueados`);
}

async function discardCopy(dest) {
  try {
    await dest.parent.removeEntry(dest.name, { recursive: true });
    dbg(`discardCopy: eliminada «${dest.name}»`);
  } catch (e) {
    dbg(`discardCopy: no se pudo eliminar «${dest.name}» — ${e.name}: ${e.message}`);
  }
}

// What a compact/enhance/restore job produces, independent of where it goes:
// { work: pyodide dir holding the new pages, pages: [...],
//   add: [["css/enhanced.css", fsPath], ...], remove: ["js/enhanced.js", ...] }.
async function applyOutputs(target, o) {
  dbg(`applyOutputs: «${target.name}» — añadir: ${o.add.map(a => a[0]).join(", ") || "nada"}, ` +
      `quitar: ${o.remove.join(", ") || "nada"}`);
  await writeBackPages(o.work, target, o.pages);
  for (const [path, fsPath] of o.add) {
    const [dir, name] = path.split("/");
    await writeAsset(target, dir, name, fsPath);
  }
  for (const path of o.remove) {
    const [dir, name] = path.split("/");
    await removeAsset(target, dir, name);
  }
}

// Runs a compact/enhance/restore job. compute() loads the pages and runs the
// Python step (fast, HTML only); outputs(res) describes the result.
//  - In place: rewrites the export itself. Not cancellable — stopping halfway
//    would leave the export inconsistent.
//  - Copy: goes through the same preflight as the fuse, into a new folder.
//    Files Safe Browsing refuses are offered as a rescue ZIP at the end, as
//    in the fuse. Python runs before any media is copied, so its errors
//    show up first.
// Returns true on success.
async function runExportJob({ src, copy, suffix, title, compute, outputs }) {
  dbg(`«${title}» sobre «${src.name}» — resultado: ${copy ? "copia" : "modificar el original"}`);
  if (!copy) {
    showJob(title);
    try {
      const res = await compute();
      setStage(t("stage_saving"), null);
      await applyOutputs(src, outputs(res));
      endJob(true, res);
      return true;
    } catch (e) {
      endJob(false, null, pyError(e));
      return false;
    }
  }

  if (!await preflight([src])) return false;
  const dest = await pickCopyTarget(src, suffix);
  if (!dest) return false;
  showJob(title, true);
  try {
    const res = await compute();
    checkCancel();
    const failed = [];
    await copyExport(src, dest.handle, failed);
    checkCancel();
    setStage(t("stage_saving"), null);
    const o = outputs(res);
    await applyOutputs(dest.handle, o);
    endJob(true, res, null, t("res_written_copy", { name: dest.name }));
    // Files the job itself writes or removes (e.g. restore drops the
    // enhanced assets) don't belong in the rescue ZIP.
    const touched = new Set([...o.add.map(a => a[0]), ...o.remove]);
    const rescuable = failed.filter(f => !touched.has(f.target));
    if (rescuable.length) offerRescue(dest.name, rescuable);
    return true;
  } catch (e) {
    await discardCopy(dest);
    if (e instanceof JobCancelled) endCancelled(t("cancel_copy_removed"));
    else endJob(false, null, pyError(e));
    return false;
  }
}

async function runCompact() {
  if (!state.compact) return;
  const mode = document.querySelector("#compact-mode button.active").dataset.mode;
  const files = $("files-n").value || "1";
  const size = chipValue("compact-chips", "compact-custom-n", "compact-custom-u");
  dbg(`compactar: objetivo ${mode === "files" ? files + " archivo(s)" : size + " por página"}`);
  await runExportJob({
    src: state.compact.handle,
    copy: destIsCopy("compact-dest"),
    suffix: "_compacted",
    title: t("job_compacting"),
    compute: async () => {
      await loadHtmlsToFS(state.compact.handle, "/work/c");
      return JSON.parse(mode === "files"
        ? glue.run_compact("/work/c", files, null)
        : glue.run_compact("/work/c", null, size));
    },
    outputs: res => ({ work: "/work/c", pages: res.pages, add: [], remove: [] }),
  });
}

/* ================= enhance / restore ================= */
function renderMeOptions() {
  const sel = $("me-select");
  if (!sel) return;
  const current = sel.value;
  sel.innerHTML = "";
  const none = document.createElement("option");
  none.value = "";
  none.textContent = t("me_none");
  sel.appendChild(none);
  (state.enhance ? state.enhance.senders : []).forEach(s => {
    const o = document.createElement("option");
    o.value = s.name;
    o.textContent = s.name + " (" + s.count + ")";
    sel.appendChild(o);
  });
  if ([...sel.options].some(o => o.value === current)) sel.value = current;
}
// refresh: re-inspection of the same export after a job — keep the options
// the user is editing unless the export's own enhancements changed.
async function setEnhanceHandle(handle, refresh) {
  const prev = state.enhance;
  const info = await inspectHandle(handle, "/work/e");
  state.enhance = info;
  $("ei-name").textContent = handle.name + (info.title ? " — " + info.title : "");
  $("ei-sub").textContent = itemSub(info);
  renderMeOptions();
  $("enhance-sel").style.display = "none";
  $("enhance-info").style.display = "";
  if (refresh && prev && JSON.stringify(prev.config) === JSON.stringify(info.config)) updateEnhanceAction();
  else loadEnhanceOptions();
}
async function pickEnhance() {
  if (!glue) return;
  try {
    const h = await showDirectoryPicker({ id: "tgx-in", mode: "readwrite" });
    await setEnhanceHandle(h);
  } catch (e) { if (e.name !== "AbortError") snack(pyError(e)); }
}
function clearEnhance() {
  state.enhance = null;
  $("enhance-sel").style.display = "";
  $("enhance-info").style.display = "none";
  updateEnhanceAction();
}
function enhanceBusy() { return jobRunning; }
/* ---- enhance options vs what the export already has ----
 * An enhanced export records the options it was built with, so the switches
 * start from that state and every change is shown against it:
 *   applied + on  -> green "Applied"      not applied + on  -> blue "Will be added"
 *   applied + off -> red "Will be removed" not applied + off -> grey
 * The button follows the diff: only additions -> Enhance, only removals ->
 * Un-enhance (a full restore once everything is off), both (or a new "who
 * are you" / layout) -> Change enhancements, nothing -> disabled, saying why. */
const ENH_OPTS = ["bubbles", "fullwidth", "quotes", "theme", "media", "note"];
function enhConfig() {
  return state.enhance ? state.enhance.config : null;
}
function enhApplied(k) {
  const c = enhConfig();
  if (!c) return false;
  return k === "fullwidth" ? !!c.fullwidth : !!c.features[k];
}
function enhOn(k) { return $("opt-" + k).checked; }
function enhLayout() { return $("layout-chips").querySelector(".chip.sel").dataset.layout; }

// Switches, "who are you" and layout as the export has them (defaults for a
// plain export).
function loadEnhanceOptions() {
  const c = enhConfig();
  for (const k of ENH_OPTS) $("opt-" + k).checked = c ? enhApplied(k) : true;
  const layout = c ? c.layout : "both";
  $("layout-chips").querySelectorAll(".chip").forEach(x =>
    x.classList.toggle("sel", x.dataset.layout === layout));
  const sel = $("me-select");
  sel.value = c && c.me && [...sel.options].some(o => o.value === c.me) ? c.me : "";
  $("bubbles-sub").classList.toggle("off", !enhOn("bubbles"));
  updateLayoutHint();
  updateEnhanceAction();
}

// { kind: "enhance" | "restore" | null, label, why, needMe }
function enhanceAction() {
  if (!state.enhance) return { kind: null };
  const c = enhConfig();
  const added = ENH_OPTS.filter(k => enhOn(k) && !enhApplied(k));
  const removed = ENH_OPTS.filter(k => !enhOn(k) && enhApplied(k));
  const me = $("me-select").value, layout = enhLayout();
  const needMe = enhOn("bubbles") && layout !== "original" && !me;
  if (!c) {
    if (!added.length) return { kind: null, why: "enh_why_none" };
    if (needMe) return { kind: null, why: "need_me", needMe };
    return { kind: "enhance", label: "enhance_btn" };
  }
  const retuned = enhOn("bubbles") && enhApplied("bubbles")
    && (me !== (c.me || "") || layout !== c.layout);
  if (!added.length && !removed.length && !retuned) return { kind: null, why: "enh_why_nochange" };
  if (ENH_OPTS.every(k => !enhOn(k))) return { kind: "restore", label: "restore_btn" };
  if (needMe) return { kind: null, why: "need_me", needMe };
  const label = added.length && !removed.length && !retuned ? "enhance_btn"
    : removed.length && !added.length && !retuned ? "restore_btn" : "change_btn";
  return { kind: "enhance", label };
}

function updateEnhanceAction() {
  const c = enhConfig();
  const a = enhanceAction();
  for (const k of ENH_OPTS) {
    const row = $("opt-" + k).closest(".switchrow");
    let tag = row.querySelector(".st-tag");
    if (!tag) {
      tag = document.createElement("span");
      tag.className = "st-tag";
      row.insertBefore(tag, row.querySelector(".switch"));
    }
    const st = !c ? "" : enhApplied(k) ? (enhOn(k) ? "keep" : "remove") : (enhOn(k) ? "add" : "");
    row.classList.remove("st-keep", "st-remove", "st-add");
    if (st) row.classList.add("st-" + st);
    tag.textContent = st ? t("st_" + st) : "";
  }
  $("layout-chips").querySelectorAll(".chip").forEach(x => x.classList.toggle("applied",
    !!c && enhApplied("bubbles") && x.dataset.layout === c.layout));
  $("me-select").classList.toggle("invalid", !!a.needMe);
  $("ei-state").textContent = c ? t("enh_detected") : "";
  $("ei-state").style.display = c ? "" : "none";
  $("enh-clear-all").style.display = c && ENH_OPTS.some(enhOn) ? "" : "none";
  $("enhance-btn-label").textContent = t(a.label || "enhance_btn");
  $("enhance-btn").disabled = !a.kind || enhanceBusy();
  $("enhance-why").textContent = a.why ? t(a.why) : "";
  $("enhance-why").style.display = a.why ? "" : "none";
  updateDestHints();
}
function enhanceDestHint() {
  return enhanceAction().kind === "restore" ? "enh_inplace_restore_hint" : "enh_inplace_hint";
}
function clearAllEnhancements() {
  for (const k of ENH_OPTS) $("opt-" + k).checked = false;
  $("bubbles-sub").classList.add("off");
  updateEnhanceAction();
}
for (const k of ENH_OPTS) {
  $("opt-" + k).addEventListener("change", () => {
    if (k === "bubbles") $("bubbles-sub").classList.toggle("off", !enhOn("bubbles"));
    updateEnhanceAction();
  });
}
$("me-select").addEventListener("change", updateEnhanceAction);

async function writeAsset(handle, dir, name, fsPath) {
  const dh = await handle.getDirectoryHandle(dir, { create: true });
  const fh = await dh.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(pyodide.FS.readFile(fsPath));
  await w.close();
}
async function removeAsset(handle, dir, name) {
  try {
    const dh = await handle.getDirectoryHandle(dir);
    await dh.removeEntry(name);
  } catch (_) {}
}
async function runEnhance() {
  const a = enhanceAction();
  if (!a.kind) return;
  if (a.kind === "restore") return runRestore();
  const f = {
    bubbles: enhOn("bubbles"), quotes: enhOn("quotes"),
    theme: enhOn("theme"), media: enhOn("media"), note: enhOn("note")
  };
  const layout = enhLayout();
  const me = $("me-select").value;
  const fullwidth = enhOn("fullwidth");
  dbg(`mejorar: disposición=${layout}, ancho completo=${fullwidth}, remitente propio=${me ? "sí" : "no"}, ` +
      `opciones=${Object.keys(f).filter(k => f[k]).join(",") || "ninguna"}`);
  const copy = destIsCopy("enhance-dest");
  const src = state.enhance.handle;
  const ok = await runExportJob({
    src, copy,
    suffix: "_enhanced",
    title: t("job_enhancing"),
    compute: async () => {
      await loadHtmlsToFS(src, "/work/e");
      return JSON.parse(glue.run_enhance("/work/e", me, layout, JSON.stringify(f), fullwidth));
    },
    outputs: res => ({
      work: "/work/e", pages: res.pages, remove: [],
      add: [["css/enhanced.css", "/work/e/css/enhanced.css"],
            ["js/enhanced.js", "/work/e/js/enhanced.js"]],
    }),
  });
  if (ok && !copy) await setEnhanceHandle(src, true);
}
async function runRestore() {
  if (!state.enhance) return;
  const copy = destIsCopy("enhance-dest");
  const src = state.enhance.handle;
  const ok = await runExportJob({
    src, copy,
    suffix: "_restored",
    title: t("job_restoring"),
    compute: async () => {
      await loadHtmlsToFS(src, "/work/e");
      return JSON.parse(glue.run_restore("/work/e"));
    },
    outputs: res => ({
      work: "/work/e", pages: res.pages, add: [],
      remove: ["css/enhanced.css", "js/enhanced.js"],
    }),
  });
  if (ok && !copy) await setEnhanceHandle(src, true);
}

/* ================= convert ================= */
// Everything the converter reads: the pages and the JSON files. Media is
// only ever referenced by relative path, so it is never loaded.
const CONVERT_INPUT_RE = /^(messages\d*\.html|result\.json|result_enriched\.json)$/;
const CONVERT_WORK = "/work/v";

// Mirrors the convertible files of the folder into a clean pyodide dir (the
// previous run may have left pages, assets or JSON behind there).
async function loadConvertToFS(handle) {
  glue.reset_dir(CONVERT_WORK);
  let found = 0, bytes = 0;
  for await (const [name, h] of handle.entries()) {
    if (h.kind === "file" && CONVERT_INPUT_RE.test(name)) {
      const buf = new Uint8Array(await (await h.getFile()).arrayBuffer());
      pyodide.FS.writeFile(CONVERT_WORK + "/" + name, buf);
      found++;
      bytes += buf.length;
    }
  }
  dbg(`loadConvertToFS: «${handle.name}» → ${found} archivo(s), ${humanSize(bytes)}`);
}

async function writeFsFile(handle, relPath, fsPath) {
  const parts = relPath.split("/");
  const name = parts.pop();
  let dir = handle;
  for (const p of parts) dir = await dir.getDirectoryHandle(p, { create: true });
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(pyodide.FS.readFile(fsPath));
  await w.close();
}

// Official-format cleanup, mirrored on the real folder: the pages and the
// css/, js/, images/ folders a genuine JSON export doesn't have.
async function removeConvertLeftovers(handle, patterns) {
  const targets = [];
  for await (const [name, h] of handle.entries()) {
    if (patterns.includes(name) && h.kind === "directory") targets.push(name);
    else if (patterns.includes("messages*.html") && h.kind === "file" && HTML_RE.test(name)) targets.push(name);
  }
  for (const name of targets) await handle.removeEntry(name, { recursive: true });
  dbg(`removeConvertLeftovers: «${handle.name}» → eliminados: ${targets.join(", ") || "nada"}`);
}

function setConvert(info, action) {
  state.convert = info;
  state.convertAction = action;
  $("cv-name").textContent = info.handle.name + (info.title ? " — " + info.title : "");
  $("convert-sel").style.display = "none";
  $("convert-info").style.display = "";
  $("convert-opts").style.display = "";
  $("cv-tojson").style.display = action === "tojson" ? "" : "none";
  $("cv-tohtml").style.display = action === "tohtml" ? "" : "none";
  $("cv-enrich").style.display = action === "enrich" ? "" : "none";
  $("cv-eo").style.display = action === "eo" ? "" : "none";
  $("convert-btn").disabled = false;
  updateConvertLabels();
}
// Hints and button label depend on the language and the chosen sub-mode.
function updateConvertLabels() {
  const action = state.convert && state.convertAction;
  const mode = document.querySelector("#cv-mode button.active").dataset.mode;
  $("cv-mode-hint").textContent = t("mode_hint_" + mode);
  // destructive-mode banners: always visible while that mode is selected,
  // with no way to dismiss them
  $("cv-faithful-warn").style.display = mode === "faithful" ? "" : "none";
  const sub = document.querySelector("#cv-eo-mode button.active").dataset.eo;
  $("cv-eo-hint").textContent = t("eo_hint_" + sub);
  $("cv-eo-warn").style.display = sub === "downgrade" ? "" : "none";
  if (!action) return;
  $("cv-sub").textContent = t("res_convert", { msgs: state.convert.messages });
  $("cv-detected").textContent = t(
    action === "enrich" ? "det_both"
      : action === "tojson" ? "det_html"
      : action === "eo" ? "det_enriched_only" : "det_json");
  $("convert-btn-label").textContent = t("convert_btn_" + (action === "eo" ? sub : action));
}
for (const id of ["cv-mode", "cv-eo-mode"]) {
  $(id).querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      $(id).querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
      updateConvertLabels();
    };
  });
}

function clearConvert() {
  state.convert = null;
  state.convertAction = null;
  $("convert-sel").style.display = "";
  $("convert-info").style.display = "none";
  $("convert-opts").style.display = "none";
  $("convert-btn").disabled = true;
}

// silent: re-analysis after a conversion — the folder may now hold both
// formats because of it, so no need to ask about that again.
async function setConvertHandle(handle, silent) {
  await loadConvertToFS(handle);
  let info;
  try {
    info = JSON.parse(glue.inspect_convert(CONVERT_WORK));
  } catch (e) {
    // same message as the other tabs when there's nothing to work with
    if (/no messages\.html/.test(String(e.message))) throw new Error(t("convert_nothing", { name: handle.name }));
    throw e;
  }
  info.handle = handle;
  dbg(`conversor «${handle.name}»: html=${info.has_html}, json=${info.has_json}, ` +
      `enriquecido=${info.has_enriched}, ${info.messages} mensajes`);
  if (info.has_html && info.has_json) {
    // both formats at once: the only useful operation is enriching the
    // official JSON with the HTML's extra data — ask harshly first
    const c = silent ? "enrich" : await askChoice(t("both_title"), t("both_body"), [
      { id: "enrich", label: t("btn_enrich"), style: "filled" },
      { id: "cancel", label: t("size_warn_cancel") },
    ]);
    if (c !== "enrich") { clearConvert(); return; }
    setConvert(info, "enrich");
  } else if (info.has_html) {
    setConvert(info, "tojson");
  } else if (info.has_json) {
    setConvert(info, "tohtml");
  } else {
    // only a result_enriched.json: let the user pick the HTML view or go
    // back to the plain official format
    setConvert(info, "eo");
  }
}
async function pickConvert() {
  if (!glue) return;
  try {
    const h = await showDirectoryPicker({ id: "tgx-in", mode: "readwrite" });
    await setConvertHandle(h);
  } catch (e) { if (e.name !== "AbortError") snack(pyError(e)); }
}

// Always in place, like the desktop converter: the output has to sit next
// to the media it references by relative path. Not cancellable — the
// Python step is quick and stopping while writing back would leave the
// folder half converted.
async function runConvert() {
  if (!state.convert || !state.convertAction) return;
  const handle = state.convert.handle;
  const mode = state.convertAction === "eo"
    ? document.querySelector("#cv-eo-mode button.active").dataset.eo
    : state.convertAction;
  const faithful = mode === "tojson" &&
    document.querySelector("#cv-mode button.active").dataset.mode === "faithful";
  dbg(`convertir: modo=${mode}${faithful ? " (formato oficial)" : ""}`);
  showJob(t("job_converting"));
  try {
    await loadConvertToFS(handle);
    const res = JSON.parse(glue.run_convert(CONVERT_WORK, mode, faithful));
    setStage(t("stage_saving"), null);
    for (const rel of res.write) await writeFsFile(handle, rel, CONVERT_WORK + "/" + rel);
    if (res.remove.length) await removeConvertLeftovers(handle, res.remove);
    dbg(`convertir: escritos ${res.write.length} archivo(s)`);
    endJob(true, res, null, mode === "tohtml"
      ? t("res_written") : handle.name + "/" + res.write[0]);
  } catch (e) {
    endJob(false, null, pyError(e));
  }
  // what the folder holds now (e.g. HTML + the new JSON -> enrich next)
  try { await setConvertHandle(handle, true); } catch (_) { clearConvert(); }
}

/* ================= init ================= */
$("download-link").href = REPO_URL + "/releases";
wireDrop($("fuse-card"), addExportHandle);
wireDrop($("compact-card"), setCompactHandle);
wireDrop($("enhance-card"), setEnhanceHandle);
wireDrop($("convert-card"), setConvertHandle);
applyLang();
window.addEventListener("load", movePill);

if (!window.showDirectoryPicker || !window.WebAssembly) {
  $("unsupported").style.display = "";
  $("loader").style.display = "none";
} else {
  boot();  // carga automática, sin preguntar
}
