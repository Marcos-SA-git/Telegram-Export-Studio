<style>
:root {
  --bg: #f6f8fb; --surface: #fff; --surface-2: #eef3f9; --outline: #e2e8f0;
  --on: #1a1f24; --muted: #62707d;
  --primary: #2296d4; --primary-strong: #1181bd; --primary-soft: #e5f3fb;
  --ok: #1e8e3e; --err: #d93025; --warn: #b26a00; --warn-soft: #fdf3e3;
  --shadow: 0 1px 2px rgba(20,40,60,.06), 0 4px 16px rgba(20,40,60,.07);
  --radius: 20px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1418; --surface: #1a2128; --surface-2: #232c35; --outline: #2d3944;
    --on: #e8edf2; --muted: #94a3b1;
    --primary: #4db8ec; --primary-strong: #6ec6f1; --primary-soft: #173341;
    --ok: #6dd58c; --err: #f28b82; --warn: #f5b954; --warn-soft: #33290f;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: light dark; }
body {
  background: var(--bg); color: var(--on);
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system,
        "SF Pro Text", Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 70px;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

/* topbar */
.topbar { display: flex; align-items: center; gap: 12px;
  max-width: 720px; margin: 0 auto; padding: 18px 20px 22px; }
.topbar .mini-logo { width: 38px; height: 38px; border-radius: 11px; flex: none;
  background: linear-gradient(135deg, #2aabee, #1683c9);
  display: grid; place-items: center; box-shadow: 0 4px 14px rgba(34,150,212,.35); }
.topbar .mini-logo svg { width: 20px; height: 20px; fill: #fff; transform: translateX(-1px); }
.topbar a.home { font-weight: 650; font-size: 16px; color: var(--on); text-decoration: none; }
.topbar .grow { flex: 1; }
select.lang { appearance: none; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--muted); background: var(--surface-2); border: 0;
  border-radius: 999px; padding: 8px 14px; cursor: pointer; outline: none; }

/* loader */
#loader .spinner-big { width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid var(--primary-soft); border-top-color: var(--primary);
  animation: spin .8s linear infinite; margin: 6px auto 16px; }
#loader { text-align: center; }
#loader h2 { text-transform: none; letter-spacing: 0; font-size: 16.5px;
  color: var(--on); margin-bottom: 6px; }
#loader p { font-size: 13.5px; color: var(--muted); }
#loader .progress { margin-top: 18px; }

/* shared UI */
.card { background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px 24px; margin-bottom: 16px;
  animation: rise .35s cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.card h2 { font-size: 12.5px; font-weight: 650; letter-spacing: .8px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.btn { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
  border-radius: 999px; transition: all .2s; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:active { transform: scale(.97); }
.btn.filled { background: linear-gradient(135deg, #2aabee, #1a8fd1); color: #fff;
  padding: 14px 30px; font-size: 15.5px; box-shadow: 0 6px 20px rgba(34,150,212,.35); }
.btn.filled:hover { box-shadow: 0 8px 26px rgba(34,150,212,.45); filter: brightness(1.04); }
.btn.filled:disabled { background: var(--surface-2); color: var(--muted);
  box-shadow: none; cursor: default; transform: none; }
.btn.filled.wide { width: 100%; }
.btn.tonal { background: var(--primary-soft); color: var(--primary-strong);
  padding: 12px 24px; font-size: 14.5px; }
.btn.danger-tonal { background: color-mix(in srgb, var(--err) 12%, transparent);
  color: var(--err); padding: 14px 20px; font-size: 14.5px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }

.tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px;
  padding: 4px; margin-bottom: 20px; position: relative; }
.tabs button { appearance: none; border: 0; background: none; color: var(--muted);
  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  padding: 8px 20px; border-radius: 999px; position: relative; z-index: 1; transition: color .25s; }
.tabs button.active { color: var(--on); }
.tabs .pill { position: absolute; top: 4px; bottom: 4px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow);
  transition: left .3s cubic-bezier(.4,0,.2,1), width .3s cubic-bezier(.4,0,.2,1); }
/* four tabs: tighten them on phones, and scroll rather than overflow the page
   in the languages with the longest labels */
.tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs button { white-space: nowrap; }
@media (max-width: 520px) { .tabs button { padding: 8px 13px; font-size: 13.5px; } }

.empty { border: 1.5px dashed var(--outline); border-radius: 14px; padding: 26px;
  text-align: center; color: var(--muted); font-size: 13.5px; margin-bottom: 10px;
  cursor: pointer; transition: all .2s; }
.empty:hover { border-color: var(--primary); color: var(--primary-strong); }
.empty.mini { padding: 13px; }
.empty svg { width: 28px; height: 28px; fill: var(--muted); opacity: .55;
  display: block; margin: 0 auto 8px; }
.empty.mini svg { width: 18px; height: 18px; margin-bottom: 3px; }
.card.dropping { outline: 2px dashed var(--primary); outline-offset: -8px;
  background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }

.export-item { display: flex; align-items: center; gap: 14px; padding: 12px 14px;
  border: 1px solid var(--outline); border-radius: 14px; margin-bottom: 10px;
  animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
.export-item .ficon { width: 40px; height: 40px; border-radius: 11px; flex: none;
  background: var(--primary-soft); display: grid; place-items: center; }
.export-item .ficon svg { width: 20px; height: 20px; fill: var(--primary); }
.export-item .info { flex: 1; min-width: 0; }
.export-item .info b { font-size: 14.5px; font-weight: 600; display: block;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.export-item .info span { font-size: 12.5px; color: var(--muted); display: block;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { appearance: none; border: 0; background: none; cursor: pointer;
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  display: grid; place-items: center; transition: background .2s; }
.iconbtn svg { width: 19px; height: 19px; fill: var(--muted); }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn:hover svg { fill: var(--err); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; cursor: pointer; font: inherit; font-size: 13.5px;
  font-weight: 600; color: var(--muted); background: var(--surface);
  border: 1.5px solid var(--outline); border-radius: 999px; padding: 8px 16px; transition: all .2s; }
.chip:hover { background: var(--surface-2); }
.chip.sel { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-strong); }
.label { font-size: 13.5px; font-weight: 600; margin: 18px 0 10px; }
.label:first-of-type { margin-top: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
#android-warn { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--warn-soft); color: var(--warn); border-radius: 12px;
  padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
#android-warn-text { flex: 1 1 240px; }
#android-warn-link { color: inherit; text-decoration: underline; flex: none; }
#android-warn-close { appearance: none; border: 0; background: none; color: inherit;
  font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; flex: none; opacity: .7; }
#android-warn-close:hover { opacity: 1; }
.field { display: flex; gap: 10px; align-items: center; }
.field input, .field select { flex: 1; font: inherit; color: var(--on);
  background: var(--surface-2); border: 1.5px solid transparent; border-radius: 12px;
  padding: 11px 14px; outline: none; min-width: 0; transition: all .2s; }
.field input:focus, .field select:focus { border-color: var(--primary); background: var(--surface); }
select.unit { flex: none; width: 84px; }
.custom-size { display: none; margin-top: 12px; max-width: 260px; }
.custom-size.show { display: flex; }

.switchrow { display: flex; align-items: center; gap: 14px; padding: 11px 0;
  border-bottom: 1px solid var(--outline); }
.switchrow:last-of-type { border-bottom: 0; }
.switchrow .sw-txt { flex: 1; min-width: 0; }
.switchrow .sw-txt b { font-size: 14px; font-weight: 600; display: block; }
.switchrow .sw-txt span { font-size: 12.5px; color: var(--muted); display: block; }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px;
  background: var(--surface-2); border: 1.5px solid var(--outline); transition: all .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px;
  width: 17px; height: 17px; border-radius: 50%; background: var(--muted); transition: all .2s; }
.switch input:checked + i { background: var(--primary); border-color: var(--primary); }
.switch input:checked + i::after { left: 22px; background: #fff; }
.subopts { transition: opacity .25s; }
.subopts.off { opacity: .4; pointer-events: none; }
.seg2 { display: inline-flex; background: var(--surface-2); border-radius: 12px;
  padding: 4px; gap: 2px; }
.seg2 button { appearance: none; border: 0; background: none; font: inherit;
  font-size: 13.5px; font-weight: 600; color: var(--muted); padding: 8px 16px;
  border-radius: 9px; cursor: pointer; transition: all .2s; }
.seg2 button.active { background: var(--surface); color: var(--on); box-shadow: var(--shadow); }
.action-row { display: flex; gap: 10px; }
.action-row .btn.filled { flex: 1; }

/* reassurance strip under the tabs: what is (and isn't) reversible in the
   current tab; destructive options stay flagged in red where they live */
.safe-note { display: flex; gap: 12px; align-items: flex-start;
  background: color-mix(in srgb, var(--ok) 8%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--ok) 28%, transparent);
  border-radius: 14px; padding: 12px 16px; margin-bottom: 16px;
  font-size: 13px; color: var(--muted); }
.safe-note svg { width: 20px; height: 20px; fill: var(--ok); flex: none; margin-top: 1px; }
.safe-note b { display: block; color: var(--on); font-weight: 600; font-size: 13.5px;
  margin-bottom: 2px; }

/* enhance: each option shown against what the export already has */
.st-tag { display: none; flex: none; font-size: 11.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.st-keep .st-tag, .st-remove .st-tag, .st-add .st-tag { display: inline-block; }
.st-keep .st-tag { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.st-remove .st-tag { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.st-add .st-tag { color: var(--primary-strong); background: var(--primary-soft); }
.st-keep .switch input:checked + i { background: var(--ok); border-color: var(--ok); }
.st-remove .switch i { border-color: var(--err);
  background: color-mix(in srgb, var(--err) 14%, transparent); }
.st-remove .switch i::after { background: var(--err); }
.chip.applied::after { content: " ✓"; color: var(--ok); }
.field select.invalid { border-color: var(--err); }
.linkbtn { appearance: none; border: 0; background: none; cursor: pointer; font: inherit;
  font-size: 13px; font-weight: 600; color: var(--err); padding: 6px 0 0; }
.linkbtn:hover { text-decoration: underline; }
#enhance-why { margin: 10px 4px 0; }
/* tabs that don't fit scroll sideways; a fade on the clipped edge(s)
   shows there is more (see updateTabsFade) */
.tabs.fade-end { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
.tabs.fade-start { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 36px), transparent);
  mask-image: linear-gradient(to left, #000 calc(100% - 36px), transparent); }
.tabs.fade-start.fade-end {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
[dir=rtl] .tabs.fade-end { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 36px), transparent);
  mask-image: linear-gradient(to left, #000 calc(100% - 36px), transparent); }
[dir=rtl] .tabs.fade-start { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
#job { display: none; }
#job.show { display: block; }
.dlg-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.job-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.spinner { width: 22px; height: 22px; flex: none; border-radius: 50%;
  border: 3px solid var(--primary-soft); border-top-color: var(--primary);
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.job-head b { flex: 1; font-size: 15px; font-weight: 600; }
.job-head .pct { font-size: 13.5px; font-weight: 700; color: var(--primary-strong); }
.job-head .btn { padding: 6px 14px; font-size: 13px; }
.job-note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.progress { height: 6px; border-radius: 6px; overflow: hidden;
  background: var(--primary-soft); margin-bottom: 4px; }
.progress i { display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #2aabee, #1a8fd1); border-radius: 6px;
  transition: width .3s cubic-bezier(.2,.7,.3,1); }
.progress.indet i { width: 40% !important;
  animation: slide 1.2s cubic-bezier(.4,0,.6,1) infinite; }
@keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
.warns { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.warn-item { display: flex; gap: 10px; align-items: flex-start;
  background: var(--warn-soft); border-radius: 12px; padding: 10px 14px;
  font-size: 13px; color: var(--warn); animation: rise .3s both; }
.warn-item svg { width: 17px; height: 17px; fill: var(--warn); flex: none; margin-top: 1px; }
/* permanent destructive-mode banner (converter: official format, downgrade) */
.warn-item.danger { background: color-mix(in srgb, var(--err) 12%, transparent);
  color: var(--err); font-weight: 600;
  border: 1.5px solid color-mix(in srgb, var(--err) 45%, transparent); }
.warn-item.danger svg { fill: var(--err); }
.warn-item.danger span { word-break: normal; }
/* Per-file warnings: one collapsible group per kind, so hundreds of them
   don't make the page endless. */
details.warn-item { display: block; }
details.warn-item summary { display: flex; gap: 10px; align-items: flex-start;
  cursor: pointer; list-style: none; }
details.warn-item summary::-webkit-details-marker { display: none; }
details.warn-item summary::after { content: "▾"; margin-left: auto; transition: transform .2s; }
details.warn-item[open] summary::after { transform: rotate(180deg); }
.warn-list { margin: 8px 0 0 27px; padding: 0; list-style: none; max-height: 220px;
  overflow: auto; font-size: 12.5px; overflow-wrap: anywhere; }
.warn-list li { padding: 2px 0; }
.rescue { margin-top: 12px; background: var(--surface-2); border-radius: 12px;
  padding: 12px 14px; font-size: 13px; }
.rescue p { margin: 0; }
.rescue .dlg-actions { margin-top: 10px; }
.warn-item span { word-break: break-all; }
.result { display: none; align-items: flex-start; gap: 14px; margin-top: 16px; }
.result.show { display: flex; }
.result .ricon { width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; }
.result .ricon.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.result .ricon.err { background: color-mix(in srgb, var(--err) 14%, transparent); }
.result .ricon svg { width: 22px; height: 22px; }
.result .ricon.ok svg { fill: var(--ok); }
.result .ricon.err svg { fill: var(--err); }
.result b { display: block; font-size: 15px; margin-bottom: 2px; }
.result p { font-size: 13.5px; color: var(--muted); word-break: break-word; }

#snack { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 80px);
  background: var(--on); color: var(--bg); font-size: 14px; font-weight: 500;
  padding: 13px 22px; border-radius: 12px; box-shadow: var(--shadow);
  opacity: 0; transition: all .3s cubic-bezier(.2,.7,.3,1); max-width: 90vw; z-index: 50; }
#snack.show { transform: translate(-50%, 0); opacity: 1; }
.srclink { display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px; font-size: 12.5px; color: var(--muted);
  text-decoration: none; opacity: .75; transition: opacity .2s; }
.srclink:hover { opacity: 1; text-decoration: underline; }
.srclink svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
.app-version { font-size: 11px; color: var(--muted); opacity: .6; margin-left: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="mini-logo"><svg viewBox="0 0 24 24"><path d="M21.4 3.1 2.2 10.5c-1 .4-1 1.8.1 2.1l4.9 1.5 1.9 5.9c.3.9 1.4 1.1 2 .4l2.7-2.8 4.9 3.6c.8.6 2 .2 2.2-.9l3-15.3c.2-1.2-.9-2.1-2-1.7l-.5-.2zM8.5 13.8l9.5-6-7.3 7.1-.3 3.2-1.9-4.3z"/></svg></div>
  <a class="home" href="index.html">Telegram Export Studio</a>
  <div class="grow"></div>
  <select class="lang" id="lang">
    <option value="es">🌐 ES</option><option value="en">🌐 EN</option>
    <option value="fr">🌐 FR</option><option value="de">🌐 DE</option>
    <option value="pt">🌐 PT</option><option value="it">🌐 IT</option>
    <option value="ru">🌐 RU</option><option value="zh">🌐 中文</option>
    <option value="ja">🌐 日本語</option><option value="hi">🌐 हिन्दी</option>
    <option value="ar">🌐 العربية</option>
  </select>
</div>

<div class="wrap">
  <div class="card" id="unsupported" style="display:none">
    <h2 data-i18n="unsup_h"></h2>
    <p style="font-size:14px" data-i18n="unsup_p"></p>
    <div style="margin-top:14px"><a class="btn tonal" id="download-link" target="_blank" rel="noopener" data-i18n="cta_download"></a></div>
  </div>

  <div class="card" id="loader">
    <div class="spinner-big"></div>
    <h2 data-i18n="loader_h"></h2>
    <p id="boot-status"></p>
    <div class="progress indet"><i></i></div>
    <p class="hint" data-i18n="loader_hint"></p>
  </div>

  <div id="studio" style="display:none">
    <div id="android-warn" style="display:none">
      <span id="android-warn-text"></span>
      <a id="android-warn-link" href="https://github.com/Marcos-SA-git/Telegram-Export-Studio/blob/main/README.md#móviles" target="_blank" rel="noopener"></a>
      <button id="android-warn-close" aria-label="close" onclick="dismissAndroidWarn()">×</button>
    </div>
    <div class="tabs" id="tabs">
      <div class="pill" id="pill"></div>
      <button data-view="fuse" class="active" data-i18n="tab_fuse"></button>
      <button data-view="compact" data-i18n="tab_compact"></button>
      <button data-view="enhance" data-i18n="tab_enhance"></button>
      <button data-view="convert" data-i18n="tab_convert"></button>

/* ================= debug oculto (?debug=1) ================= */
// Off by default, invisible in the UI, and safe to leave in the code that
// ships to GitHub Pages: nobody sees it without deliberately adding the
// query param. Turns on a small on-page log panel (useful on a phone with
// no attached devtools) plus console logging for deeper inspection via
// chrome://inspect over USB.
const DEBUG = new URLSearchParams(location.search).has("debug");
let dbgPanel = null, dbgLog = null, dbgCopyBtn = null;
let dbgStick = true; // auto-scroll to bottom only while the user hasn't scrolled up to read

// The panel gets its own reserved space (a right-hand column on wide
// screens, a bottom strip on narrow ones) and the page is inset by the same
// amount, so it never covers the app. Fixed size from the start; it can be
// minimised to its title bar.
const DBG_CSS = `
:root { --dbg-h: 35vh; --dbg-w: min(40vw, 560px); }
html.dbg-on body { padding-bottom: calc(var(--dbg-h) + 70px); }
#dbg-panel { position: fixed; left: 0; right: 0; bottom: 0; height: var(--dbg-h);
  display: flex; flex-direction: column; background: #0a0d0a; color: #0f0;
  font: 11px/1.4 monospace; z-index: 99999; border-top: 1px solid #0f04;
  box-sizing: border-box; }
#dbg-panel .dbg-bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px;
  border-bottom: 1px solid #0f04; flex: none; }
#dbg-panel .dbg-bar span { flex: 1; opacity: .7; }
#dbg-panel button { background: #0f02; color: #0f0; border: 1px solid #0f05;
  border-radius: 4px; padding: 2px 10px; font: 11px monospace; cursor: pointer; }
#dbg-panel .dbg-log { overflow-y: auto; padding: 6px 8px; flex: 1;
  white-space: pre-wrap; word-break: break-all; }
@media (min-width: 1000px) {
  html.dbg-on body { padding-bottom: 70px; margin-right: var(--dbg-w); }
  #dbg-panel { left: auto; top: 0; width: var(--dbg-w); height: auto;
    border-top: 0; border-left: 1px solid #0f04; }
}
html.dbg-on.dbg-min body { padding-bottom: 70px; margin-right: 0; }
html.dbg-min #dbg-panel { top: auto; left: auto; width: auto; height: auto;
  border: 1px solid #0f04; border-radius: 6px 0 0 0; }
html.dbg-min #dbg-panel .dbg-log { display: none; }
html.dbg-min #dbg-panel .dbg-bar { border-bottom: 0; }
`;

function ensureDbgPanel() {
  if (dbgPanel) return;
  const style = document.createElement("style");
  style.textContent = DBG_CSS;
  document.head.appendChild(style);
  document.documentElement.classList.add("dbg-on");

  dbgPanel = document.createElement("div");
  dbgPanel.id = "dbg-panel";

  const bar = document.createElement("div");
  bar.className = "dbg-bar";
  const label = document.createElement("span");
  label.textContent = "debug";
  const minBtn = document.createElement("button");
  minBtn.textContent = "Minimizar";
  minBtn.onclick = () => {
    const min = document.documentElement.classList.toggle("dbg-min");
    minBtn.textContent = min ? "Expandir" : "Minimizar";
    if (!min && dbgStick) dbgLog.scrollTop = dbgLog.scrollHeight;
  };
  dbgCopyBtn = document.createElement("button");
  dbgCopyBtn.textContent = "Copiar";
  dbgCopyBtn.onclick = async () => {
    const text = Array.from(dbgLog.children).map(d => d.textContent).join("\n");
    try {
      await navigator.clipboard.writeText(text);
      dbgCopyBtn.textContent = "✓ copiado";
    } catch (_) {
      dbgCopyBtn.textContent = "✗ error";
    }
    setTimeout(() => { dbgCopyBtn.textContent = "Copiar"; }, 1500);
  };
  bar.appendChild(label);
  bar.appendChild(dbgCopyBtn);
  bar.appendChild(minBtn);

  dbgLog = document.createElement("div");
  dbgLog.className = "dbg-log";
  // If the user scrolls up to read past entries, stop yanking them back
  // down on every new line; resume auto-scroll once they're back near
  // the bottom.
  dbgLog.addEventListener("scroll", () => {
    dbgStick = dbgLog.scrollHeight - dbgLog.scrollTop - dbgLog.clientHeight < 24;
  });

  dbgPanel.appendChild(bar);
  dbgPanel.appendChild(dbgLog);
  document.body.appendChild(dbgPanel);
}

function dbg(msg) {
  if (!DEBUG) return;
  const line = `[${(performance.now() / 1000).toFixed(2)}s] ${msg}`;
  console.log(line);
  ensureDbgPanel();
  const p = document.createElement("div");
  p.textContent = line;
  dbgLog.appendChild(p);
  if (dbgStick) dbgLog.scrollTop = dbgLog.scrollHeight;
}
if (DEBUG) {
  window.addEventListener("error", (e) => {
    dbg(`ERROR JS no capturado: ${e.message} (${e.filename}:${e.lineno}:${e.colno})` +
        (e.error && e.error.stack ? `\n${e.error.stack}` : ""));
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    dbg(`PROMESA rechazada sin capturar: ${r && r.name ? r.name + ": " : ""}${r && r.message ? r.message : r}` +
        (r && r.stack ? `\n${r.stack}` : ""));
  });
}

const ENGINE = ["telegram_export_fuser.py", "telegram_export_compactor.py",
                "telegram_export_enhancer.py", "telegram_export_converter.py"];

const GLUE_PY = String.raw`
import json, re, shutil
from collections import Counter
from pathlib import Path
import telegram_export_fuser as F
import telegram_export_compactor as C
import telegram_export_enhancer as E
import telegram_export_converter as V

def set_progress(cb):
    F.progress_hook = (lambda kind, payload:
                       cb(kind, json.dumps(payload, default=str)))

def inspect(path):
    d = Path(path)
    pages = sorted(d.glob("messages*.html"),
                   key=lambda p: int(re.search(r"(\d*)\.html", p.name)
                                     .group(1) or 0))
    if not pages:
        raise ValueError("no messages.html")
    ids = set()
    senders = Counter()
    title = None
    first = last = None
    for p in pages:
        h = p.read_text(encoding="utf-8")
        ids.update(int(m) for m in re.findall(r'id="message(\d+)"', h))
        senders.update(F.count_senders(h))
        if title is None:
            tm = re.search(r'<div class="text bold">\s*\n(.*?)\n', h)
            title = tm.group(1).strip() if tm else None
        ds = F.DATE_TITLE_RE.findall(h)
        if ds:
            if first is None:
                first = "/".join(ds[0][:3])
            last = "/".join(ds[-1][:3])
    head = pages[0].read_text(encoding="utf-8")
    enhanced = "css/enhanced.css" in head[:4000]
    # which enhancements it already has, so the UI can show them applied;
    # a page enhanced before the config was written counts as "all on"
    config = E.read_config(head) if enhanced else None
    if enhanced and config is None:
        config = {"me": None, "layout": "both", "fullwidth": True,
                  "features": {k: True for k in E.ALL_FEATURES}}
    return json.dumps({
        "title": title, "messages": len(ids),
        "pages": [p.name for p in pages],
        "first": first, "last": last,
        "senders": [{"name": n, "count": c} for n, c in senders.most_common()],
        "kind": "group" if len(senders) > 2 else "private",
        "enhanced": enhanced,
        "config": config,
    })

def run_fuse(paths_json, out, page_size, force, media_maps_json):
    paths = [Path(p) for p in json.loads(paths_json)]
    F.media_maps = json.loads(media_maps_json)
    try:
        res = F.fuse(F.order_exports(paths), Path(out),
                     F.parse_size(page_size), force=bool(force))
    finally:
        F.media_maps = None
    return json.dumps(res)

def run_compact(path, files, size):
    if files:
        res = C.compact(Path(path), int(files), None)
    else:
        res = C.compact(Path(path), None, F.parse_size(size))
    return json.dumps(res)

def run_enhance(path, me, layout, features_json, fullwidth):
    res = E.enhance(Path(path), me or None, layout,
                    json.loads(features_json), fullwidth=bool(fullwidth))
    return json.dumps(res)

def run_restore(path):
    return json.dumps(E.restore(Path(path)))

def reset_dir(path):
    shutil.rmtree(path, ignore_errors=True)
    Path(path).mkdir(parents=True)

# The converter only reads/writes the pages and the JSON files: the folder
# is mirrored with just those, and media paths are never resolved.
def inspect_convert(path):
    d = Path(path)
    found = V.detect_formats(d)
    info = {"title": None, "messages": 0, "has_html": found["html"],
            "has_json": found["json"], "has_enriched": found["enriched"]}
    if found["html"]:
        base = json.loads(inspect(path))
        info.update(title=base["title"], messages=base["messages"])
    elif found["json"] or found["enriched"]:
        doc = V.load_chat(d / ("result.json" if found["json"]
                               else "result_enriched.json"))
        info.update(title=doc.get("name"),
                    messages=len(doc.get("messages", [])))
    else:
        raise ValueError("no messages.html / result.json / "
                         "result_enriched.json")
    return json.dumps(info)

# Runs one conversion and lists what to copy back to the real folder
# ("write", relative paths) and what to delete from it ("remove").
def run_convert(path, mode, faithful):
    d = Path(path)
    if mode == "tojson":
        res = V.to_json(d, faithful=bool(faithful))
    elif mode == "tohtml":
        res = V.from_json(d)
    elif mode == "enrich":
        res = V.enrich_json(d)
    elif mode == "downgrade":
        res = V.downgrade_json(d)
    else:
        raise ValueError("unknown conversion mode: " + mode)
    if mode == "tohtml":
        res["write"] = list(res["pages"]) + sorted(V.ASSETS)
    else:
        res["write"] = [Path(res["out_file"]).name]
    res["remove"] = (["messages*.html"] + list(V.ASSET_DIRS)
                     if res.get("removed_assets") else [])
    return json.dumps(res)
`;

/* ================= FS plumbing ================= */
const HTML_RE = /^messages\d*\.html$/;
const ASSETS = ["css", "js", "images"];

// getFile() here only fetches metadata: the per-file cost is one IPC
// round-trip to the browser process, not CPU work, so on desktop a fixed
// pool of in-flight calls hides that latency regardless of core count.
// On Android each call goes through the Storage Access Framework, which
// serializes them anyway (see copyMediaTree), so concurrency only queues.
const SCAN_CONCURRENCY = isAndroid ? 1 : 16;

// Read-only pass over the exports' media (same trees copyMediaTree will later
// walk): estimates the merged media size, before anything is copied or an
// output folder is picked.
// The estimate applies the same dedup rule as resolveTarget — a file whose
// relative path and size were already seen in another export is skipped by
// the merge, so it isn't counted twice here either. Listing first (names
// only, cheap) gives the file total, so the size pass can show a real %.
async function scanExports(handles) {
  const files = [];
  let lastPaint = 0;
  function throttled() {
    const now = performance.now();
    if (now - lastPaint < 100) return false;
    lastPaint = now;
    return true;
  }
  async function list(dir, rel) {
    for await (const [name, h] of dir.entries()) {
      checkCancel();
      if (h.kind === "directory") {
        if (rel === "" && ASSETS.includes(name)) continue;
        await list(h, rel + name + "/");
        continue;
      }
      if (rel === "") continue; // top-level messages*.html, not media
      files.push({ h, path: rel + name });
      if (throttled()) setStage(t("stage_listing", { n: files.length }), null);
    }
  }
  const tList = performance.now();
  for (const h of handles) await list(h, "");
  dbg(`scanExports: ${files.length} archivos listados en ${((performance.now() - tList) / 1000).toFixed(1)}s ` +
      `(concurrency=${SCAN_CONCURRENCY}, android=${isAndroid})`);

  const seen = new Set();
  let totalSize = 0, done = 0, next = 0;
  function paint() {
    setStage(t("stage_analyze", { n: done, total: files.length, size: humanSize(totalSize) }),
             files.length ? done / files.length : null);
  }
  async function worker() {
    while (next < files.length) {
      checkCancel();
      const f = files[next++];
      const size = (await f.h.getFile()).size;
      const key = f.path + "\0" + size;
      if (!seen.has(key)) { seen.add(key); totalSize += size; }
      done++;
      if (throttled()) paint();
    }
  }
  const tSize = performance.now();
  await Promise.all(Array.from({ length: Math.min(SCAN_CONCURRENCY, files.length) }, worker));
  paint();
  dbg(`scanExports: tamaños en ${((performance.now() - tSize) / 1000).toFixed(1)}s — ` +
      `~${humanSize(totalSize)} tras deduplicar`);
  return { totalSize };
}

function humanSize(n) {
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + units[i];
}

async function dirFromDrop(e) {

function wireDrop(el, onHandle) {
  ["dragover", "dragenter"].forEach(ev => el.addEventListener(ev, e => {
    e.preventDefault();
    el.classList.add("dropping");
  }));
  el.addEventListener("dragleave", e => {
    if (!el.contains(e.relatedTarget)) el.classList.remove("dropping");

/* ================= minimal ZIP writer (rescue ZIP) =====================
 * Streams a ZIP straight to an open FileSystemWritableFileStream — STORE-only
 * (no compression — chat media is already compressed), no external
 * dependency. Used for the rescue ZIP: files Safe Browsing refused to write
 * into the output folder can still be saved inside a .zip (see offerRescue).
 *
 * Sources are read in chunks, never as one ArrayBuffer: Chrome cannot read a
 * file of 2 GiB or more in one go, and real chat exports carry such videos.
 * Peak memory is one ZIP_CHUNK regardless of file or archive size. Zip64
 * records are emitted whenever a size, offset or entry count outgrows the
 * classic 32/16-bit fields — merged exports easily reach tens of GB.
 * ======================================================================= */
const ZIP64_LIMIT = 0xFFFFFFFF;
const ZIP_CHUNK = 8 * 1024 * 1024;

// Slicing-by-8 CRC32: ~1.7x the byte-at-a-time table loop in V8, which
// matters when tens of GB go through it.
const CRC_TABLE = (() => {
  const t = new Uint32Array(256 * 8);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  for (let n = 0; n < 256; n++) {
    for (let s = 1; s < 8; s++) {
      const prev = t[(s - 1) * 256 + n];
      t[s * 256 + n] = (prev >>> 8) ^ t[prev & 0xFF];
    }
  }
  return t;
})();
// Takes and returns the running (pre-inversion) CRC state: start with
// 0xFFFFFFFF, finish with (state ^ 0xFFFFFFFF) >>> 0.
function crc32Update(c, b) {
  const T = CRC_TABLE;
  let i = 0;
  const end8 = b.length - 8;
  for (; i <= end8; i += 8) {
    const a = (c ^ (b[i] | (b[i + 1] << 8) | (b[i + 2] << 16) | (b[i + 3] << 24))) >>> 0;
    c = T[1792 + (a & 0xFF)] ^ T[1536 + ((a >>> 8) & 0xFF)]
      ^ T[1280 + ((a >>> 16) & 0xFF)] ^ T[1024 + (a >>> 24)]
      ^ T[768 + b[i + 4]] ^ T[512 + b[i + 5]] ^ T[256 + b[i + 6]] ^ T[b[i + 7]];
  }
  for (; i < b.length; i++) c = T[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return c >>> 0;
}
function dosDateTime(date) {
  const time = ((date.getHours() & 0x1f) << 11) | ((date.getMinutes() & 0x3f) << 5)
             | ((date.getSeconds() >> 1) & 0x1f);
  const day = (((date.getFullYear() - 1980) & 0x7f) << 9) | (((date.getMonth() + 1) & 0xf) << 5)
            | (date.getDate() & 0x1f);
  return { time, day };
}
class ZipWriter {
  // writable: an open FileSystemWritableFileStream. Entries are written
  // straight to it; only per-entry metadata is kept for the central directory.
  constructor(writable) {
    this.writable = writable;
    this.offset = 0;
    this.entries = [];
  }
  async _push(bytes) {
    await this.writable.write(bytes);
    this.offset += bytes.length;
  }
  // source: Uint8Array or Blob/File. onChunk(nBytes) runs after each chunk
  // is written (progress; it may throw to cancel). The CRC is only known
  // after the data, so it's patched into the local header with a positional
  // write. If anything fails midway, the partial entry is truncated away so
  // the archive stays consistent and the caller can skip the file.
  async addFile(name, source, onChunk) {
    const blob = source instanceof Uint8Array ? new Blob([source]) : source;
    const size = blob.size;
    const nameBytes = new TextEncoder().encode(name);
    const mtime = (source instanceof File && source.lastModified)
      ? new Date(source.lastModified) : new Date();
    const { time, day } = dosDateTime(mtime);
    const offset = this.offset;
    const big = size >= ZIP64_LIMIT;

    const header = new DataView(new ArrayBuffer(30 + nameBytes.length + (big ? 20 : 0)));
    header.setUint32(0, 0x04034b50, true);
    header.setUint16(4, big ? 45 : 20, true); // version needed
    header.setUint16(6, 0x0800, true);        // general flags: UTF-8 names
    header.setUint16(8, 0, true);             // method: store
    header.setUint16(10, time, true);
    header.setUint16(12, day, true);
    header.setUint32(14, 0, true);            // crc32, patched below
    header.setUint32(18, big ? 0xFFFFFFFF : size, true);
    header.setUint32(22, big ? 0xFFFFFFFF : size, true);
    header.setUint16(26, nameBytes.length, true);
    header.setUint16(28, big ? 20 : 0, true); // extra field length
    new Uint8Array(header.buffer).set(nameBytes, 30);
    if (big) {
      const x = 30 + nameBytes.length;
      header.setUint16(x, 0x0001, true);      // Zip64 extended information
      header.setUint16(x + 2, 16, true);
      header.setBigUint64(x + 4, BigInt(size), true);
      header.setBigUint64(x + 12, BigInt(size), true);
    }

    try {
      await this._push(new Uint8Array(header.buffer));
      let crc = 0xFFFFFFFF, read = 0;
      let buf = new Uint8Array(ZIP_CHUNK), fill = 0;
      const flush = async () => {
        if (!fill) return;
        await this._push(fill === buf.length ? buf : buf.subarray(0, fill));
        if (onChunk) onChunk(fill);
        buf = new Uint8Array(ZIP_CHUNK);
        fill = 0;
      };
      const reader = blob.stream().getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        crc = crc32Update(crc, value);
        read += value.length;
        let pos = 0;
        while (pos < value.length) {
          const n = Math.min(value.length - pos, buf.length - fill);
          buf.set(value.subarray(pos, pos + n), fill);
          fill += n;
          pos += n;
          if (fill === buf.length) await flush();
        }
      }
      await flush();
      if (read !== size) throw new Error(`size changed while reading (${read} != ${size})`);
      crc = (crc ^ 0xFFFFFFFF) >>> 0;
      const c = new DataView(new ArrayBuffer(4));
      c.setUint32(0, crc, true);
      await this.writable.write({ type: "write", position: offset + 14, data: new Uint8Array(c.buffer) });
      await this.writable.seek(this.offset);
      this.entries.push({ name: nameBytes, crc, size, offset, time, day });
    } catch (e) {
      try {
        await this.writable.truncate(offset); // also pulls the cursor back
        this.offset = offset;
      } catch (_) {}
      throw e;
    }
  }
  // Writes the central directory and end records. They are gathered into
  // ZIP_CHUNK-sized blocks: one write() per entry costs an IPC round trip
  // each, which adds up with tens of thousands of files.
  async writeDirectory() {
    const cdStart = this.offset;
    const parts = [];
    let pending = 0;
    const flush = async () => {
      if (!pending) return;
      const block = new Uint8Array(pending);
      let o = 0;
      for (const p of parts) { block.set(p, o); o += p.length; }
      parts.length = 0;
      pending = 0;
      await this._push(block);
    };
    for (const e of this.entries) {
      const bigSize = e.size >= ZIP64_LIMIT;
      const bigOff = e.offset >= ZIP64_LIMIT;
      const extraLen = (bigSize || bigOff) ? 4 + (bigSize ? 16 : 0) + (bigOff ? 8 : 0) : 0;
      const rec = new DataView(new ArrayBuffer(46 + e.name.length + extraLen));
      rec.setUint32(0, 0x02014b50, true);
      rec.setUint16(4, 45, true);             // version made by
      rec.setUint16(6, extraLen ? 45 : 20, true);
      rec.setUint16(8, 0x0800, true);
      rec.setUint16(10, 0, true);             // store
      rec.setUint16(12, e.time, true);
      rec.setUint16(14, e.day, true);
      rec.setUint32(16, e.crc, true);
      rec.setUint32(20, bigSize ? 0xFFFFFFFF : e.size, true);
      rec.setUint32(24, bigSize ? 0xFFFFFFFF : e.size, true);
      rec.setUint16(28, e.name.length, true);
      rec.setUint16(30, extraLen, true);
      rec.setUint16(32, 0, true);             // comment length
      rec.setUint16(34, 0, true);             // disk number
      rec.setUint16(36, 0, true);             // internal attrs
      rec.setUint32(38, 0, true);             // external attrs
      rec.setUint32(42, bigOff ? 0xFFFFFFFF : e.offset, true);
      new Uint8Array(rec.buffer).set(e.name, 46);
      if (extraLen) {
        // Zip64 extra: only the fields saturated above, in spec order.
        let x = 46 + e.name.length;
        rec.setUint16(x, 0x0001, true);
        rec.setUint16(x + 2, extraLen - 4, true);
        x += 4;
        if (bigSize) {
          rec.setBigUint64(x, BigInt(e.size), true);
          rec.setBigUint64(x + 8, BigInt(e.size), true);
          x += 16;
        }
        if (bigOff) rec.setBigUint64(x, BigInt(e.offset), true);
      }
      parts.push(new Uint8Array(rec.buffer));
      pending += rec.byteLength;
      if (pending >= ZIP_CHUNK) await flush();
    }
    await flush();
    const cdSize = this.offset - cdStart;
    const n = this.entries.length;
    const need64 = n >= 0xFFFF || cdSize >= ZIP64_LIMIT || cdStart >= ZIP64_LIMIT;
    if (need64) {
      const z64Start = this.offset;
      const r = new DataView(new ArrayBuffer(56 + 20));
      r.setUint32(0, 0x06064b50, true);       // Zip64 end of central directory
      r.setBigUint64(4, 44n, true);
      r.setUint16(12, 45, true);
      r.setUint16(14, 45, true);
      r.setUint32(16, 0, true);
      r.setUint32(20, 0, true);
      r.setBigUint64(24, BigInt(n), true);
      r.setBigUint64(32, BigInt(n), true);
      r.setBigUint64(40, BigInt(cdSize), true);
      r.setBigUint64(48, BigInt(cdStart), true);
      r.setUint32(56, 0x07064b50, true);      // Zip64 end of central directory locator
      r.setUint32(60, 0, true);
      r.setBigUint64(64, BigInt(z64Start), true);
      r.setUint32(72, 1, true);
      await this._push(new Uint8Array(r.buffer));
    }
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(4, 0, true);
    eocd.setUint16(6, 0, true);
    eocd.setUint16(8, Math.min(n, 0xFFFF), true);
    eocd.setUint16(10, Math.min(n, 0xFFFF), true);
    eocd.setUint32(12, cdSize >= ZIP64_LIMIT ? 0xFFFFFFFF : cdSize, true);
    eocd.setUint32(16, cdStart >= ZIP64_LIMIT ? 0xFFFFFFFF : cdStart, true);
    eocd.setUint16(20, 0, true);              // comment length
    await this._push(new Uint8Array(eocd.buffer));
  }
  // close() is where Chrome turns the .crswap into the final file: it first
  // re-reads the whole archive to hash it for Safe Browsing, so it takes
  // about as long as reading the ZIP back from disk.
  async close() {
    await this.writable.close();
  }
  async finish() {
    await this.writeDirectory();
    await this.close();
  }
}

async function loadHtmlsToFS(handle, target) {
  try { pyodide.FS.mkdirTree(target); } catch (_) {}
  for (const n of pyodide.FS.readdir(target)) {
    if (HTML_RE.test(n)) pyodide.FS.unlink(target + "/" + n);
  }
  let found = 0, bytes = 0;
  const t0 = performance.now();
  for await (const [name, h] of handle.entries()) {
    if (h.kind === "file" && HTML_RE.test(name)) {
      const buf = new Uint8Array(await (await h.getFile()).arrayBuffer());
      pyodide.FS.writeFile(target + "/" + name, buf);
      found++;
      bytes += buf.length;
    }
  }
  dbg(`loadHtmlsToFS: «${handle.name}» → ${found} página(s), ${humanSize(bytes)} en ` +
      `${((performance.now() - t0) / 1000).toFixed(1)}s`);
  if (!found) throw new Error(t("drop_no_messages", { name: handle.name }));
}

async function writeBackPages(target, handle, pageNames) {
  for (const name of pageNames) {
    const data = pyodide.FS.readFile(target + "/" + name);
    const fh = await handle.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(data);
    await w.close();
  }
  const keep = new Set(pageNames);
  const stale = [];
  for await (const [name, h] of handle.entries()) {
    if (h.kind === "file" && HTML_RE.test(name) && !keep.has(name)) stale.push(name);
  }
  for (const name of stale) await handle.removeEntry(name);
  dbg(`writeBackPages: «${handle.name}» → ${pageNames.length} página(s) escritas, ${stale.length} antiguas eliminadas`);
}

let cachedConcurrency = null;

// The per-call FSA round-trip latency (and how much parallel I/O the device
// tolerates before things start queueing up instead of overlapping) varies
// wildly — a phone over Android's Storage Access Framework, an old laptop
// with a spinning disk, a desktop with NVMe. Rather than guess, time a few
// short trials against the real output directory and keep climbing the
// concurrency ladder only while it still pays off.
async function benchmarkConcurrency(outHandle) {
  if (cachedConcurrency) return cachedConcurrency;
  // A few seconds of saturated small writes: say so, or the jump in CPU
  // under a "merging" label looks alarming.
  setStage(t("stage_benchmark"), null);
  const tb0 = performance.now();

  const BENCH_DIR = "_tgx_bench";
  const payload = new Uint8Array(4096);
  let dir;
  try {
    dir = await outHandle.getDirectoryHandle(BENCH_DIR, { create: true });

    async function writeOne(n) {
      const t0 = performance.now();
      const fh = await dir.getFileHandle("f" + n, { create: true });
      const w = await fh.createWritable();
      await w.write(payload);
      await w.close();
      return performance.now() - t0;
    }

    // The very first FSA call pays a one-off cold-start cost (directory
    // handle setup, first SAF round trip) that has nothing to do with
    // steady-state throughput. Discard it so it doesn't bias level 2.
    const warmupMs = await writeOne("warmup");
    dbg(`benchmark: warm-up write = ${warmupMs.toFixed(0)}ms (descartado)`);

    // Two full batches per run so the concurrency level under test is
    // actually saturated at least once, even at the higher rungs.
    async function runBatches(concurrency) {
      const files = concurrency * 2;
      const t0 = performance.now();
      for (let batch = 0; batch < 2; batch++) {
        const jobs = [];
        for (let i = 0; i < concurrency; i++) jobs.push(writeOne(batch * concurrency + i));
        await Promise.all(jobs);
      }
      return files / ((performance.now() - t0) / 1000);
    }

    // Best-of-2: a single run can be skewed by one unlucky slow SAF call.
    // Take the faster of two runs as this level's real-world rate.
    async function trial(concurrency) {
      checkCancel();
      const a = await runBatches(concurrency);
      const b = await runBatches(concurrency);
      const rate = Math.max(a, b);
      dbg(`benchmark: nivel ${concurrency} — intento1=${a.toFixed(1)} archivos/s, ` +
          `intento2=${b.toFixed(1)} archivos/s, mejor=${rate.toFixed(1)} archivos/s`);
      return rate;
    }

    let best = 2, bestRate = await trial(2);
    let misses = 0;
    for (const c of [4, 8, 16, 32, 64]) {
      const rate = await trial(c);
      if (rate > bestRate * 1.15) {
        const gain = (rate / bestRate - 1) * 100;
        best = c; bestRate = rate; misses = 0;
        dbg(`benchmark: nivel ${c} gana (+${gain.toFixed(0)}%) → nuevo mejor`);
      } else if (++misses > 1) {
        dbg(`benchmark: nivel ${c} sin mejora relevante, 2º fallo seguido → paro aquí`);
        break; // two levels in a row without real gains: genuinely plateaued
      } else {
        dbg(`benchmark: nivel ${c} sin mejora relevante (tolerancia, sigo probando)`);
      }
    }
    cachedConcurrency = best;
    dbg(`benchmark: elegido concurrency=${best} (${bestRate.toFixed(1)} archivos/s) ` +
        `en ${((performance.now() - tb0) / 1000).toFixed(1)}s`);
  } catch (e) {
    if (e instanceof JobCancelled) throw e; // finally still removes the bench dir
    cachedConcurrency = 4; // benchmark itself failed: fall back conservatively
    dbg(`benchmark: FALLÓ (${e && e.message}) → fallback concurrency=4`);
  } finally {
    if (dir) {
      try {
        for await (const [name] of dir.entries()) await dir.removeEntry(name);
      } catch (_) {}
      try { await outHandle.removeEntry(BENCH_DIR, { recursive: true }); } catch (_) {}
    }
  }
  return cachedConcurrency;
}

// Decides the deduped target path for one media file (dedup-by-name+size,
// renaming on genuine collision) and records it into `written`/`renames`.
// Shared by the real-directory copy path and the ZIP fallback so both
// produce the exact same layout — `renames` is what tells the Python fuse
// step how to rewrite HTML references either way.
function resolveTarget(written, renames, rel, name, size, isAsset) {
  let tgt = rel + name;
  if (written.has(tgt)) {
    if (isAsset || written.get(tgt) === size) return null;
    let n = 2;
    const dot = name.indexOf(".");
    const stem = dot < 0 ? name : name.slice(0, dot);
    const ext = dot < 0 ? "" : name.slice(dot);
    let cand;
    do { cand = rel + stem + "__" + n + ext; n++; }
    while (written.has(cand) && written.get(cand) !== size);
    renames[tgt] = cand;
    if (written.has(cand)) return null;
    tgt = cand;
  }
  written.set(tgt, size);
  return tgt;
}

// failedSink (optional array) receives { handle, target, size } for every
// file whose write failed, so the caller can offer them afterwards as a
// rescue ZIP (see offerRescue).
async function copyMediaTree(srcHandle, outHandle, written, includeAssets, concurrency, failedSink) {
  const renames = {};
  const blocked = [];

  // File I/O round-trips (getFile/getFileHandle/createWritable) are cheap on
  // desktop but on Android each one is a slow IPC hop through the Storage
  // Access Framework. Running several file copies concurrently hides that
  // per-call latency behind overlap instead of paying it once per file.
  const CONCURRENCY = concurrency || 8;
  dbg(`copyMediaTree: arrancando con concurrency=${CONCURRENCY} (includeAssets=${includeAssets})`);
  const t0 = performance.now();
  let filesCopied = 0;
  let active = 0;
  const queue = [];
  function schedule(fn) {
    return new Promise((resolve, reject) => {
      queue.push({ fn, resolve, reject });
      pump();
    });
  }
  function pump() {
    while (active < CONCURRENCY && queue.length) {
      const job = queue.shift();
      active++;
      job.fn().then(job.resolve, job.reject).finally(() => { active--; pump(); });
    }
  }

  // written.has/get/set decide target filenames (dedup + renaming on
  // collision); that bookkeeping must stay serialized even though the
  // actual file copies below run concurrently, or two files could race
  // onto the same target name.
  let lock = Promise.resolve();
  function withLock(fn) {
    const p = lock.then(fn, fn);
    lock = p.catch(() => {});
    return p;
  }

  async function copyOneFile(h, dst, rel, name) {
    checkCancel();
    const isAsset = ASSETS.includes(rel.split("/")[0]);
    const f = await h.getFile();
    const target = await withLock(() => resolveTarget(written, renames, rel, name, f.size, isAsset));
    if (target === null) return;
    const tName = target.slice(target.lastIndexOf("/") + 1);
    const tf0 = performance.now();
    // Chrome runs Safe Browsing on the *close* of a writable stream and
    // rejects the whole write if the verdict is "dangerous" — an .exe or
    // .apk someone once sent in the chat is enough. Without this catch a
    // single such attachment rejects here, blows up the Promise.all in
    // walk() and throws away the entire merge. Instead the file is skipped
    // with a warning and handed to failedSink: the HTML keeps its reference,
    // and the rescue ZIP puts the file back at that path afterwards.
    try {
      const fh = await dst.getFileHandle(tName, { create: true });
      await f.stream().pipeTo(await fh.createWritable(), { signal: cancelSignal() });
    } catch (e) {
      // Cancelled midway: pipeTo already aborted the writable (Chrome drops
      // its .crswap); only the empty entry getFileHandle created remains.
      if (e instanceof JobCancelled) {
        try { await dst.removeEntry(tName); } catch (_) {}
        throw e;
      }
      blocked.push(target);
      if (failedSink) failedSink.push({ handle: h, target, size: f.size });
      dbg(`copyMediaTree: NO copiado — ${target} (${f.size}B): ${e.name}: ${e.message}`);
      // getFileHandle already created the entry; a failed write leaves a
      // 0-byte file behind that looks like a corrupt media file.
      try { await dst.removeEntry(tName); } catch (_) {}
      pushWarnItem("blocked", `${target} (${humanSize(f.size)})`);
      return;
    }
    // Big videos legitimately take seconds; flag only files whose time isn't
    // explained by their size (under 1 MB/s even with copies in parallel).
    if (DEBUG) {
      const ms = performance.now() - tf0;
      if (ms > 1000 && f.size / ms < 1000) {
        dbg(`copyMediaTree: archivo lento — ${target} (${f.size}B) = ${ms.toFixed(0)}ms`);
      }
    }
    mediaDone++;
    filesCopied++;
    setStage(t("stage_media", { n: mediaDone }), null);
  }

  // Waits for every copy it started before rethrowing: with Promise.all the
  // first rejection (a cancel) returned at once while queued copies kept
  // running and repainting the progress after the job had already ended.
  // Queued ones bail out fast at their own checkCancel().
  async function walk(src, dst, rel) {
    const jobs = [];
    try {
      for await (const [name, h] of src.entries()) {
        checkCancel();
        if (h.kind === "directory") {
          const isAsset = rel === "" && ASSETS.includes(name);
          if (isAsset && !includeAssets) continue;
          jobs.push(walk(h, await dst.getDirectoryHandle(name, { create: true }),
                         rel + name + "/"));
          continue;
        }
        if (rel === "") continue;
        jobs.push(schedule(() => copyOneFile(h, dst, rel, name)));
      }
    } finally {
      const results = await Promise.allSettled(jobs);
      const failed = results.find(r => r.status === "rejected");
      if (failed) throw failed.reason;
    }
  }

  await walk(srcHandle, outHandle, "");
  const elapsed = (performance.now() - t0) / 1000;
  dbg(`copyMediaTree: terminado — ${filesCopied} archivos en ${elapsed.toFixed(1)}s ` +
      `(${(filesCopied / elapsed || 0).toFixed(1)} archivos/s, concurrency=${CONCURRENCY})`);
  if (blocked.length) dbg(`copyMediaTree: ${blocked.length} archivos no copiados: ${blocked.join(", ")}`);
  return renames;
}

/* ================= job UI ================= */
// A running job lives only in this tab: reloading or closing it kills the
// operation midway (a partial output folder or a truncated ZIP, and for
// compact/enhance an export rewritten halfway), so the browser is asked to
// confirm leaving while one runs. Browsers show their own generic text.
let jobRunning = false;
window.addEventListener("beforeunload", (e) => {
  if (!jobRunning) return;
  dbg("intento de recargar/cerrar la pestaña con un trabajo en marcha → se pide confirmación");
  e.preventDefault();
  e.returnValue = "";
});

// Cooperative cancellation: long loops call checkCancel() between files or
// chunks. Only jobs that write to a separate output (fuse) are cancellable —
// compact/enhance rewrite the export in place, where stopping halfway would
// leave it inconsistent.
class JobCancelled extends Error {
  constructor() { super("cancelled"); this.name = "JobCancelled"; }
}
// jobCancel.signal aborts streaming copies already in flight (pipeTo), so a
// cancel doesn't wait for a multi-GB video to finish copying first.
let jobCancel = null;
function checkCancel() {
  if (jobCancel && jobCancel.requested) throw new JobCancelled();
}
function cancelSignal() {
  return jobCancel ? jobCancel.ctrl.signal : undefined;
}
function cancelJob() {
  if (!jobCancel || jobCancel.requested) return;
  jobCancel.requested = true;
  jobCancel.ctrl.abort(new JobCancelled());
  dbg("cancelación solicitada por el usuario");
  $("job-cancel").disabled = true;
  $("job-cancel").textContent = t("job_cancelling");
}

let jobT0 = 0;
function showJob(title, cancellable) {
  dbg(`trabajo iniciado: «${title}»${cancellable ? " (cancelable)" : ""}`);
  jobT0 = performance.now();
  jobRunning = true;
  jobCancel = cancellable ? { requested: false, ctrl: new AbortController() } : null;
  const cancelBtn = $("job-cancel");
  cancelBtn.style.display = cancellable ? "" : "none";
  cancelBtn.disabled = false;
  cancelBtn.textContent = t("job_cancel");
  $("job-note").textContent = t("job_keep_open");
  $("job-note").style.display = "";
  $("job").classList.add("show");
  $("job-stage").textContent = title;
  $("job-pct").textContent = "";
  $("job-spin").style.display = "";
  $("job-progress").classList.add("indet");
  $("job-bar").style.width = "0%";
  $("job-warns").innerHTML = "";
  $("job-result").classList.remove("show");
  $("job-rescue").style.display = "none";
  rescue = null;
  document.querySelectorAll(".btn.filled").forEach(b => b.disabled = true);
  $("job").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
// Dismisses the job card without a result (e.g. after the pre-fuse scan,
// before a prompt), restoring buttons the way endJob does.
function stopJobUi() {
  jobRunning = false;
  jobCancel = null;
  $("job-cancel").style.display = "none";
  $("job-note").style.display = "none";
}
function hideJob() {
  dbg(`trabajo cerrado sin resultado tras ${((performance.now() - jobT0) / 1000).toFixed(1)}s`);
  stopJobUi();
  $("job").classList.remove("show");
  document.querySelectorAll(".btn.filled").forEach(b => b.disabled = false);
  renderExports();
  if (!state.compact) $("compact-btn").disabled = true;
  updateEnhanceAction();
  if (!state.convert) $("convert-btn").disabled = true;
}
function setStage(text, frac) {
  $("job-stage").textContent = text;
  if (typeof frac === "number") {
    $("job-progress").classList.remove("indet");
    $("job-bar").style.width = Math.round(frac * 100) + "%";
    $("job-pct").textContent = Math.round(frac * 100) + "%";
  } else {
    $("job-progress").classList.add("indet");
    $("job-pct").textContent = "";
  }
}
function pushWarn(text) {
  dbg(`aviso: ${text}`);
  const div = document.createElement("div");
  div.className = "warn-item";
  div.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg><span></span>';
  div.querySelector("span").textContent = text;
  $("job-warns").appendChild(div);
}
// Per-file warnings go into one collapsible group per kind; its summary
// ("warn_group_<kind>") carries the running count and the explanation.
const warnGroups = {};
function pushWarnItem(kind, text) {
  dbg(`aviso (${kind}): ${text}`);
  let g = warnGroups[kind];
  if (!g || !g.el.isConnected) {
    const el = document.createElement("details");
    el.className = "warn-item";
    el.innerHTML = '<summary><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>' +
      '<span></span></summary><ul class="warn-list"></ul>';
    $("job-warns").appendChild(el);
    g = warnGroups[kind] = { el, n: 0 };
  }
  g.n++;
  g.el.querySelector("summary span").textContent = t("warn_group_" + kind, { n: g.n });
  const li = document.createElement("li");
  li.textContent = text;
  g.el.querySelector(".warn-list").appendChild(li);
}
function onPyProgress(kind, payloadJson) {
  const p = JSON.parse(payloadJson);
  if (kind === "warn") return pushWarn(p);
  setStage(t("stage_" + p.key, { name: p.name || "", n: p.copied || 0 }),
           typeof p.frac === "number" ? p.frac : null);
}
function endJob(ok, res, errText, subText, cancelled) {
  const secs = ((performance.now() - jobT0) / 1000).toFixed(1);
  if (ok) dbg(`trabajo terminado en ${secs}s — ${res.messages} mensajes` +
              (res.pages ? `, ${res.pages.length} página(s)` : ""));
  else if (cancelled) dbg(`trabajo CANCELADO tras ${secs}s — ${errText}`);
  else dbg(`trabajo FALLIDO tras ${secs}s — ${errText}`);
  stopJobUi();
  $("job-spin").style.display = "none";
  $("job-progress").classList.remove("indet");
  $("job-bar").style.width = "100%";
  $("job-pct").textContent = "";
  document.querySelectorAll(".btn.filled").forEach(b => b.disabled = false);
  renderExports();
  if (!state.compact) $("compact-btn").disabled = true;
  updateEnhanceAction();
  if (!state.convert) $("convert-btn").disabled = true;
  const icon = $("job-ricon");
  $("job-result").classList.add("show");
  if (ok) {
    $("job-stage").textContent = t("job_done");
    icon.className = "ricon ok";
    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
    $("job-rtitle").textContent = res.pages
      ? t("res_summary", { msgs: res.messages, pages: res.pages.length })
      : (typeof res.added_fields === "number"
         ? t("res_enriched", { msgs: res.messages, n: res.added_fields })
         : t("res_convert", { msgs: res.messages }))
        + (res.removed_assets ? t("res_removed_assets") : "");
    $("job-rsub").textContent = subText || t("res_written");
  } else {
    $("job-stage").textContent = t("job_error");
    icon.className = "ricon err";
    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';
    $("job-rtitle").textContent = t("job_failed");
    $("job-rsub").textContent = errText || "";
  }
}
function endCancelled(subText) {
  endJob(false, null, subText, undefined, true);
  $("job-stage").textContent = t("job_cancelled");
  $("job-rtitle").textContent = t("job_cancelled");
}

/* ================= fuse ================= */
function kindLabel(e) {
  return e.kind === "group"
    ? t("kind_group", { n: e.senders.length }) : t("kind_private");
}
function itemSub(e) {
  return kindLabel(e) + " · "
    + t("item_sub", { msgs: e.messages, pages: e.pages.length })
    + (e.first ? " · " + e.first + " → " + e.last : "");
}
function renderExports() {
  const list = $("export-list");
  if (!list) return;
  list.innerHTML = "";
  state.exports.forEach((e, i) => {
    const div = document.createElement("div");
    div.className = "export-item";
    div.innerHTML = '<div class="ficon"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg></div>'
      + '<div class="info"><b></b><span></span></div>'
      + '<button class="iconbtn"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>';
    div.querySelector("b").textContent =
      e.handle.name + (e.title ? " — " + e.title : "");
    div.querySelector("span").textContent = itemSub(e);
    div.querySelector(".iconbtn").onclick = () => {
      state.exports.splice(i, 1);
      renderExports();
    };
    list.appendChild(div);
  });
  const n = state.exports.length;
  $("export-empty").classList.toggle("mini", n > 0);
  $("export-empty-text").textContent = t(n ? "fuse_add_more" : "fuse_empty");
  $("fuse-btn").disabled = n < 2 || !glue;
  $("fuse-btn-label").textContent = n < 2 ? t("fuse_btn") : t("fuse_btn_n", { n });
}

async function inspectHandle(handle, target) {
  await loadHtmlsToFS(handle, target);
  const info = JSON.parse(glue.inspect(target));
  info.handle = handle;
  info.target = target;
  // Names of the carpeta/participants stay out: logs get shared.
  dbg(`inspección «${handle.name}»: ${info.messages} mensajes, ${info.pages.length} página(s), ` +
      `${info.kind === "group" ? "grupo" : "privado"} (${info.senders.length} remitentes), ` +
      `${info.first || "?"} → ${info.last || "?"}, mejorado=${!!info.enhanced}`);
  return info;
}

// Same in-page question card as the other prompts (not the browser's own
// confirm(), whose buttons can't be translated).
async function confirmAdd(text) {
  return await askChoice(t("confirm_title"), text, [
    { id: "add", label: t("btn_continue"), style: "filled" },
    { id: "cancel", label: t("size_warn_cancel") },
  ]) === "add";
}
async function addExportHandle(handle) {
  for (const e of state.exports) {
    if (await handle.isSameEntry(e.handle)) return snack(t("snack_dup"));
  }
  const info = await inspectHandle(handle, "/work/ex" + state.exports.length);
  if (state.exports.length) {
    const first = state.exports[0];
    if (first.title && info.title && first.title !== info.title) {
      const ok = await confirmAdd(t("confirm_mix", { a: info.title, b: first.title }));
      dbg(`añadir export: títulos distintos → ${ok ? "añadido igualmente" : "descartado"}`);
      if (!ok) return;
      state.forceMix = true;
    } else if (first.kind !== info.kind) {
      const ok = await confirmAdd(t("confirm_kind"));
      dbg(`añadir export: mezcla grupo/privado → ${ok ? "añadido igualmente" : "descartado"}`);
      if (!ok) return;
      state.forceMix = true;
    }
  }
  state.exports.push(info);
  dbg(`añadir export: ahora hay ${state.exports.length} en la lista`);
  renderExports();
}
async function addExport() {
  if (!glue) return;
  try {
    const h = await showDirectoryPicker({ id: "tgx-in" });
    await addExportHandle(h);
  } catch (e) { if (e.name !== "AbortError") snack(pyError(e)); }
}

// Pre-write pass shared by the fuse and the compact/enhance copy mode, all
// before any output is picked: scans the sources (progress + cancel) and
// warns when the result is large. Files Safe Browsing refuses during the
// copy aren't predicted here: they're listed as they happen and offered
// as a rescue ZIP at the end. Returns { totalSize }, or null if cancelled.
async function preflight(handles) {
  showJob(t("stage_listing", { n: 0 }), true);
  let scan;
  try {
    scan = await scanExports(handles);
  } catch (e) {
    if (e instanceof JobCancelled) endCancelled(t("cancel_nothing_written"));
    else endJob(false, null, pyError(e));
    return null;
  }
  hideJob();
  const { totalSize } = scan;
  const cancelOpt = { id: "cancel", label: t("size_warn_cancel") };

  if (totalSize > LARGE_EXPORT_BYTES) {
    const c = await askChoice(t("size_warn_h"), t("size_warn_text", { size: humanSize(totalSize) }), [
      { id: "desktop", label: t("cta_download"), style: "tonal", href: REPO_URL + "/releases" },
      { id: "continue", label: t("size_warn_continue"), style: "filled" },
      cancelOpt,
    ]);
    if (c !== "continue") return null; // "desktop" already opened the releases page
  }

  // The folder picker needs a recent user click. If the scan took a while
  // and the size prompt didn't supply a fresh one, ask for it explicitly
  // rather than letting showDirectoryPicker fail silently.
  if (navigator.userActivation && !navigator.userActivation.isActive) {
    dbg("preflight: activación de usuario caducada tras el análisis → pido clic");
    const c = await askChoice(t("ready_h"), t("ready_text", { size: humanSize(totalSize) }), [
      { id: "go", label: t("pick_out_btn"), style: "filled" },
      cancelOpt,
    ]);
    if (c !== "go") return null;
  }
  return { totalSize };
}

async function runFuse() {
  if (!await preflight(state.exports.map(e => e.handle))) return;

  // Always a new folder, like the desktop's "ChatExport_fused" default: no
  // need to find an empty one, and a cancelled merge can simply be removed.
  const dest = await pickNewFolder(state.exports.map(e => e.handle), "ChatExport_fused");
  if (!dest) return;
  const out = dest.handle;
  showJob(t("job_fusing"), true);
  try {
    mediaDone = 0;
    const maps = {};
    const written = new Map();
    const failed = [];
    const concurrency = await benchmarkConcurrency(out);
    for (let i = 0; i < state.exports.length; i++) {
      maps["/work/ex" + i] = await copyMediaTree(
        state.exports[i].handle, out, written, i === 0, concurrency, failed);
    }
    setStage(t("stage_reading"), null);
    for (let i = 0; i < state.exports.length; i++) {
      checkCancel();
      await loadHtmlsToFS(state.exports[i].handle, "/work/ex" + i);
    }
    checkCancel();
    try { pyodide.FS.mkdirTree("/out"); } catch (_) {}
    const paths = state.exports.map((_, i) => "/work/ex" + i);
    const res = JSON.parse(glue.run_fuse(
      JSON.stringify(paths), "/out",
      chipValue("fuse-chips", "fuse-custom-n", "fuse-custom-u"),
      state.forceMix, JSON.stringify(maps)));
    checkCancel();
    setStage(t("stage_saving"), null);
    await writeBackPages("/out", out, res.pages);
    endJob(true, res, null, t("res_written_fuse", { name: dest.name }));
    if (failed.length) offerRescue(dest.name, failed);
  } catch (e) {
    await discardCopy(dest);
    if (e instanceof JobCancelled) endCancelled(t("cancel_fuse_removed"));
    else endJob(false, null, pyError(e));
  }
}

// Files Chrome refused to write into the output folder (Safe Browsing) can
// still travel inside a .zip. The fuse and the copy mode keep their source
// handles and, once done, offer a ZIP holding just those files at their
// final paths:
// extracting it into the output folder fills the gaps, so no link stays
// dead. It's built on click because the save dialog needs a user gesture.
let rescue = null;
function offerRescue(folder, files) {
  const total = files.reduce((s, f) => s + f.size, 0);
  rescue = { folder, files };
  dbg(`rescate: ${files.length} archivo(s), ${humanSize(total)} disponibles para ZIP aparte`);
  $("job-rescue-text").textContent = t("rescue_text", { n: files.length, size: humanSize(total), folder });
  const btn = $("job-rescue-btn");
  btn.textContent = t("rescue_btn");
  btn.disabled = false;
  $("job-rescue").style.display = "";
}

async function downloadRescueZip() {
  if (!rescue || jobRunning) return;
  const { folder, files } = rescue;
  let fh;
  try {
    fh = await showSaveFilePicker({
      suggestedName: t("rescue_zip_name", { folder }) + ".zip",
      types: [{ description: "ZIP", accept: { "application/zip": [".zip"] } }],
    });
  } catch (e) {
    dbg(`rescate: selector de guardado cerrado/fallido — ${e.name}: ${e.message}`);
    return;
  }
  const btn = $("job-rescue-btn");
  const text = $("job-rescue-text");
  btn.disabled = true;
  jobRunning = true; // closing the tab now would leave a truncated ZIP
  const t0 = performance.now();
  let writable;
  const missing = [];
  try {
    writable = await fh.createWritable();
    const zip = new ZipWriter(writable);
    // No root folder: the entries mirror the output folder's own layout.
    await zip.addFile(t("rescue_readme_name"), new TextEncoder().encode(t("rescue_readme", { folder })));
    for (let i = 0; i < files.length; i++) {
      text.textContent = t("rescue_progress", { done: i, n: files.length });
      try {
        await zip.addFile(files[i].target, await files[i].handle.getFile());
      } catch (e) {
        missing.push(files[i].target);
        dbg(`rescate: NO añadido — ${files[i].target}: ${e.name}: ${e.message}`);
      }
    }
    await zip.writeDirectory();
    text.textContent = t("stage_zip_verify", { size: humanSize(zip.offset) });
    await zip.close();
    dbg(`rescate: ZIP guardado en ${((performance.now() - t0) / 1000).toFixed(1)}s — ` +
        `${files.length - missing.length}/${files.length} archivos, ${humanSize(zip.offset)}`);
    text.textContent = t("rescue_done", { folder }) +
      (missing.length ? " " + t("rescue_partial", { n: missing.length, list: missing.join(", ") }) : "");
    btn.textContent = t("rescue_btn_again");
    btn.disabled = false;
  } catch (e) {
    dbg(`rescate: FALLÓ — ${e.name}: ${e.message}` + (e.stack ? `\n${e.stack}` : ""));
    if (writable) { try { await writable.abort(); } catch (_) {} }
    try { if (fh.remove) await fh.remove(); } catch (_) {}
    text.textContent = t("rescue_failed", { err: pyError(e) });
    btn.disabled = false;
  } finally {
    jobRunning = false;
  }
}

/* ================= compact ================= */

}
async function pickCompact() {

    const h = await showDirectoryPicker({ id: "tgx-in", mode: "readwrite" });
    await setCompactHandle(h);
  } catch (e) { if (e.name !== "AbortError") snack(pyError(e)); }
